<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng bảng với CSS</title>
    <style>
        body {
            font-family: Arial, Tahoma, sans-serif;
            padding: 30px;
            background-color: #f8fafc;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            height: 50px;
            text-align: left;
            background-color: #333;
            color: white;
            padding: 12px 15px;
        }

        td {
            padding: 12px 15px;
            background-color: #f2f2f2;
            color: #333;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body>

    <h2>Danh sách học viên</h2>

    <table>
        <tr>
            <th>Họ tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>Web</td>
        </tr>
        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>Web</td>
        </tr>
    </table>

</body>
</html>
