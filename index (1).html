<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:30 - 09:30</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>14:00 - 15:30</td>
            <td>Báo cáo tiến độ dự án</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Ba</td>
            <td>09:00 - 10:30</td>
            <td>Họp nội bộ phòng Kỹ thuật</td>
        </tr>
        <tr>
            <td>15:00 - 16:30</td>
            <td>Đánh giá chất lượng sản phẩm</td>
        </tr>
        <tr>
            <td>Thứ Tư</td>
            <td colspan="2">08:00 - 17:00: Hội thảo chiến lược công ty (kéo dài cả ngày)</td>
        </tr>
    </table>

</html>
